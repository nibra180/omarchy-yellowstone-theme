# Volcanic brown surfaces with a geothermal blue-to-sulfur edge. Pale steam
# carries text while orange stone is reserved for errors and secondary states.

[bar]
background       = "#151008"
background-alpha = 0.95
text             = "#d4cfb1"
active           = "#a9c8df"
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 30

[hyprland]
active-border            = "rgb(a9c8df) rgb(d7c78f) 35deg"
active-border-foreground = "rgb(a9c8df) rgb(dfdbc5) 35deg"

[controls]
normal-color        = "#d4cfb1"
normal-fill-alpha   = 0.04
normal-border       = "rgb(67635d) rgb(332c23) 35deg"
normal-border-width = 1
normal-border-alpha = 0.46

hover-cursor-color        = "#dfdbc5"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "rgb(a9c8df) rgb(d7c78f) 35deg"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.58

focus-color        = "#dfdbc5"
focus-fill-alpha   = 0.10
focus-border       = "hyprland.active-border"
focus-border-width = 1
focus-border-alpha = 0.78

selected-color        = "#dfdbc5"
selected-fill-alpha   = 0.16
selected-border       = "#a9c8df"
selected-border-width = 0
selected-border-alpha = 0.90

pressed-color        = "#ebd56e"
pressed-fill-alpha   = 0.22
selection-color      = "#a9c8df"
selection-fill-alpha = 0.32

[spacing]
scale = 1.0
scale-with-font = true
control-gap = 8
control-padding-x = 11
control-padding-y = 6
input-padding-y = 7
control-height = 29
popup-row-height = 30
row-gap = 7
row-padding-x = 12
label-gap = 4
panel-gap = 14
panel-padding = 18
popup-padding = 14
dropdown-width = 240
searchable-dropdown-width = 268
number-field-width = 120
searchable-popup-min-height = 220

[font]
base-size = 12
caption = 10
body-small = 11
body = 12
subtitle = 13
title = 14
heading = 16
display = 24
display-large = 28
icon-small = 11
icon = 14
icon-large = 18

[popups]
background       = "#151008"
background-alpha = 0.96
text             = "#d4cfb1"
border           = "hyprland.active-border"
border-alpha     = 0.84
border-width     = 2

[tooltip]
background       = "#0e0b06"
background-alpha = 0.98
text             = "#d4cfb1"
border           = "hyprland.active-border-foreground"
border-alpha     = 0.58

[notifications]
background       = "#151008"
background-alpha = 0.97
text             = "#d4cfb1"
border           = "hyprland.active-border"
border-alpha     = 0.80
border-width     = 2
countdown        = "#d7c78f"

[launcher]
background                 = "#151008"
background-alpha           = 0.96
text                       = "#dad6bd"
border                     = "hyprland.active-border"
border-alpha               = 0.88
border-width               = 2
scrim                      = "#0e0b06"
scrim-alpha                = 0.68
selected-background        = "rgb(332c23) rgb(1c150b) 35deg"
selected-background-alpha  = 0.34
selected-text              = "#dfdbc5"
selected-border            = "#a9c8df"
selected-border-alpha      = 0.92
selected-border-width      = 0
selected-border-width-left = 3

[menu]
background                 = "#151008"
background-alpha           = 0.97
text                       = "#dad6bd"
border                     = "hyprland.active-border"
border-alpha               = 0.88
border-width               = 2
scrim                      = "#0e0b06"
scrim-alpha                = 0.66
selected-background        = "rgb(332c23) rgb(1c150b) 35deg"
selected-background-alpha  = 0.34
selected-text              = "#dfdbc5"
selected-border            = "#a9c8df"
selected-border-alpha      = 0.92
selected-border-width      = 0
selected-border-width-left = 3

[polkit]
background       = "#151008"
background-alpha = 0.98
text             = "#d4cfb1"
text-error       = "#cba183"
border           = "hyprland.active-border"
border-error     = "#cba183"
border-alpha     = 0.96
scrim            = "#0e0b06"
scrim-alpha      = 0.72
accent           = "#a9c8df"

[lock]
background       = "#151008"
background-alpha = 0.90
text             = "#d4cfb1"
placeholder      = "#9f9b85"
text-error       = "#cba183"
border           = "rgb(67635d) rgb(1c150b) 35deg"
border-active    = "hyprland.active-border"
border-error     = "#cba183"
border-alpha     = 0.96
selection        = "#a9c8df"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#0e0b06"
scrim-alpha             = 0.70
text                    = "#d4cfb1"
selected-border         = "#a9c8df"
selected-border-alpha   = 1.0
unselected-border       = "#67635d"
unselected-border-alpha = 0.40

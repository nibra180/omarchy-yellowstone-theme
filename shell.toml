# Volcanic black surfaces with an ember-orange-to-sulfur edge. Warm parchment
# carries text while sunset red is reserved for errors.

[bar]
background       = "#0b0700"
background-alpha = 0.95
text             = "#eae5cf"
active           = "#c7692d"
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 30

[hyprland]
active-border            = "rgb(c7692d) rgb(bda01a) 35deg"
active-border-foreground = "rgb(c7692d) rgb(efecdb) 35deg"

[controls]
normal-color        = "#eae5cf"
normal-fill-alpha   = 0.04
normal-border       = "rgb(65635d) rgb(27221a) 35deg"
normal-border-width = 1
normal-border-alpha = 0.46

hover-cursor-color        = "#efecdb"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "rgb(c7692d) rgb(bda01a) 35deg"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.58

focus-color        = "#efecdb"
focus-fill-alpha   = 0.10
focus-border       = "hyprland.active-border"
focus-border-width = 1
focus-border-alpha = 0.78

selected-color        = "#efecdb"
selected-fill-alpha   = 0.16
selected-border       = "#c7692d"
selected-border-width = 0
selected-border-alpha = 0.90

pressed-color        = "#e6c800"
pressed-fill-alpha   = 0.22
selection-color      = "#c7692d"
selection-fill-alpha = 0.32

[spacing]
scale = 1.0
scale-with-font = true
control-gap = 8
control-padding-x = 11
control-padding-y = 6
input-padding-y = 7
control-height = 29
popup-row-height = 30
row-gap = 7
row-padding-x = 12
label-gap = 4
panel-gap = 14
panel-padding = 18
popup-padding = 14
dropdown-width = 240
searchable-dropdown-width = 268
number-field-width = 120
searchable-popup-min-height = 220

[font]
base-size = 12
caption = 10
body-small = 11
body = 12
subtitle = 13
title = 14
heading = 16
display = 24
display-large = 28
icon-small = 11
icon = 14
icon-large = 18

[popups]
background       = "#0b0700"
background-alpha = 0.96
text             = "#eae5cf"
border           = "hyprland.active-border"
border-alpha     = 0.84
border-width     = 2

[tooltip]
background       = "#080500"
background-alpha = 0.98
text             = "#eae5cf"
border           = "hyprland.active-border-foreground"
border-alpha     = 0.58

[notifications]
background       = "#0b0700"
background-alpha = 0.97
text             = "#eae5cf"
border           = "hyprland.active-border"
border-alpha     = 0.80
border-width     = 2
countdown        = "#bda01a"

[launcher]
background                 = "#0b0700"
background-alpha           = 0.96
text                       = "#ede9d6"
border                     = "hyprland.active-border"
border-alpha               = 0.88
border-width               = 2
scrim                      = "#080500"
scrim-alpha                = 0.68
selected-background        = "rgb(27221a) rgb(0f0900) 35deg"
selected-background-alpha  = 0.34
selected-text              = "#efecdb"
selected-border            = "#c7692d"
selected-border-alpha      = 0.92
selected-border-width      = 0
selected-border-width-left = 3

[menu]
background                 = "#0b0700"
background-alpha           = 0.97
text                       = "#ede9d6"
border                     = "hyprland.active-border"
border-alpha               = 0.88
border-width               = 2
scrim                      = "#080500"
scrim-alpha                = 0.66
selected-background        = "rgb(27221a) rgb(0f0900) 35deg"
selected-background-alpha  = 0.34
selected-text              = "#efecdb"
selected-border            = "#c7692d"
selected-border-alpha      = 0.92
selected-border-width      = 0
selected-border-width-left = 3

[polkit]
background       = "#0b0700"
background-alpha = 0.98
text             = "#eae5cf"
text-error       = "#c2612f"
border           = "hyprland.active-border"
border-error     = "#c2612f"
border-alpha     = 0.96
scrim            = "#080500"
scrim-alpha      = 0.72
accent           = "#c7692d"

[lock]
background       = "#0b0700"
background-alpha = 0.90
text             = "#eae5cf"
placeholder      = "#b0ac9b"
text-error       = "#c2612f"
border           = "rgb(65635d) rgb(0f0900) 35deg"
border-active    = "hyprland.active-border"
border-error     = "#c2612f"
border-alpha     = 0.96
selection        = "#c7692d"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#080500"
scrim-alpha             = 0.70
text                    = "#eae5cf"
selected-border         = "#c7692d"
selected-border-alpha   = 1.0
unselected-border       = "#65635d"
unselected-border-alpha = 0.40
